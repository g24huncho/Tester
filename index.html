<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>DP Combat — Train Smarter. Fight Better.</title>
<style>
  /* ============================================================
     DP COMBAT — Brand system
     Discipline. Performance. Progression.
     ============================================================ */
  :root {
    --ink:        #07070a;   /* near-black canvas — the dark gym */
    --ink-2:      #0d0d12;
    --ink-3:      #14141b;
    --line:       #23232e;
    --text:       #f2f0ea;
    --text-dim:   #8d8c96;
    --gold-deep:  #6d5518;   /* championship metal ramp */
    --gold:       #c9a24a;
    --gold-hi:    #f7e7ae;
    --red:        #d7263d;   /* corner red — sparing accent only */
    --radius: 18px;
    --tap-min: 64px;         /* glove-friendly minimum tap target */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

  .condensed {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", -apple-system, sans-serif;
    font-stretch: condensed;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  /* Polished championship metal — used for the wordmark */
  .metal {
    background: linear-gradient(100deg,
      #2e250c 0%, var(--gold-deep) 14%, var(--gold) 32%,
      var(--gold-hi) 47%, #fffbe8 50%, var(--gold-hi) 53%,
      var(--gold) 68%, var(--gold-deep) 86%, #2e250c 100%);
    background-size: 250% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ============================================================
     LAUNCH SEQUENCE
     Dark → spotlight → punch impact → metal reveal → light sweep
     ============================================================ */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: opacity .9s ease, visibility .9s;
  }
  #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }

  #splash .stage {
    position: relative; text-align: center;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #splash.shake .stage { animation: shake .45s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translate(-1px, 1px); }
    20%, 80% { transform: translate(2px, -2px); }
    30%, 50%, 70% { transform: translate(-4px, 2px); }
    40%, 60% { transform: translate(4px, -1px); }
  }

  /* Spotlight — a single overhead beam finding the metal in the dark */
  .spotlight {
    position: absolute; inset: -20%;
    background:
      radial-gradient(ellipse 42% 34% at 50% 44%,
        rgba(247,231,174,.14) 0%, rgba(201,162,74,.05) 45%, transparent 70%);
    opacity: 0;
    transition: opacity 2.2s ease;
    pointer-events: none;
  }
  #splash.lit .spotlight { opacity: 1; }

  /* Dust drifting through the beam */
  #dust { position: absolute; inset: 0; pointer-events: none; }

  /* Impact — the punch lands */
  .flash {
    position: absolute; inset: 0; background: #fff;
    opacity: 0; pointer-events: none;
  }
  #splash.hit .flash { animation: flash .5s ease-out both; }
  @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }

  .shockwave {
    position: absolute; left: 50%; top: 47%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border: 2px solid rgba(247,231,174,.8);
    border-radius: 50%;
    opacity: 0; pointer-events: none;
  }
  #splash.hit .shockwave { animation: wave 1.1s cubic-bezier(.16,.84,.3,1) both; }
  @keyframes wave {
    0%   { opacity: .9; transform: scale(1); border-width: 3px; }
    100% { opacity: 0;  transform: scale(60); border-width: 1px; }
  }

  /* The mark. Revealed by the impact, settles like hung metal. */
  .mark { opacity: 0; transform: scale(1.14); }
  #splash.reveal .mark {
    animation: settle 1.6s cubic-bezier(.16,.84,.3,1) both;
  }
  @keyframes settle {
    0%   { opacity: 0; transform: scale(1.14); filter: blur(6px); }
    35%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  .mark .dp {
    font-size: clamp(92px, 24vw, 190px);
    font-weight: 900;
    line-height: .9;
    letter-spacing: .02em;
  }
  .mark .combat {
    font-size: clamp(22px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: .52em;
    text-indent: .52em; /* optically recenters tracked type */
    margin-top: 10px;
  }
  /* Light travelling across the metal */
  #splash.sweep .metal { animation: sweep 2.6s cubic-bezier(.4,0,.2,1) both; }
  @keyframes sweep {
    0%   { background-position: 100% 0; }
    100% { background-position: 0% 0; }
  }

  .mark .rule {
    width: 0; height: 1px; margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transition: width 1.4s cubic-bezier(.16,.84,.3,1);
  }
  #splash.sweep .rule { width: min(70vw, 420px); }

  .tagline {
    margin-top: 22px;
    font-size: clamp(11px, 2.8vw, 14px);
    color: var(--text-dim);
    letter-spacing: .38em;
    text-indent: .38em;
    opacity: 0;
    transition: opacity 1.6s ease .4s;
  }
  #splash.sweep .tagline { opacity: 1; }

  .enter {
    position: absolute; left: 0; right: 0; bottom: max(48px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
    opacity: 0; transition: opacity .8s ease;
    pointer-events: none;
  }
  #splash.ready .enter { opacity: 1; pointer-events: auto; }
  .enter button {
    min-height: var(--tap-min);
    padding: 18px 54px;
    border: 1px solid rgba(201,162,74,.55);
    border-radius: 999px;
    color: var(--gold-hi);
    font-weight: 700;
    letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
    font-size: 14px;
    background: rgba(201,162,74,.06);
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,162,74,0); }
    50%      { box-shadow: 0 0 34px 0 rgba(201,162,74,.22); }
  }

  .skip {
    position: absolute; top: max(18px, env(safe-area-inset-top)); right: 18px;
    color: var(--text-dim); font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    padding: 14px 18px; min-height: 48px;
    opacity: .7;
  }

  /* ============================================================
     HOME — entering the gym
     ============================================================ */
  #home { opacity: 0; transition: opacity .8s ease .2s; min-height: 100%; }
  #home.in { opacity: 1; }

  .shell {
    max-width: 560px; margin: 0 auto;
    padding: 0 20px calc(120px + env(safe-area-inset-bottom));
  }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: max(18px, env(safe-area-inset-top)) 2px 6px;
  }
  .brandmark { display: flex; align-items: baseline; gap: 10px; }
  .brandmark .dp { font-weight: 900; font-size: 26px; }
  .brandmark .combat { font-size: 12px; font-weight: 700; letter-spacing: .34em; color: var(--text-dim); text-transform: uppercase; }

  #soundToggle {
    min-width: 56px; min-height: 48px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--ink-2);
    font-size: 19px;
    display: grid; place-items: center;
  }

  .hero { padding: 26px 2px 8px; }
  .hero .greet { color: var(--text-dim); font-size: 14px; letter-spacing: .22em; text-transform: uppercase; }
  .hero h1 {
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 900; line-height: 1.08;
    margin-top: 10px;
  }
  .hero .motto {
    margin-top: 12px; color: var(--text-dim); font-size: 15px;
  }
  .hero .motto b { color: var(--gold); font-weight: 700; }

  /* Primary action — reachable in one motion, with gloves on */
  .cta {
    display: block; width: 100%;
    margin-top: 24px;
    min-height: 76px;
    border-radius: var(--radius);
    background: linear-gradient(140deg, #1b1508, #241b09 45%, #1b1508);
    border: 1px solid rgba(201,162,74,.5);
    padding: 20px 24px;
    text-align: left;
    position: relative; overflow: hidden;
    transition: transform .12s ease;
  }
  .cta:active { transform: scale(.985); }
  .cta::after { /* resting sheen so the metal never looks flat */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(247,231,174,.08) 50%, transparent 70%);
    background-size: 250% 100%;
    animation: idle-sheen 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes idle-sheen { 0%,100% { background-position: 120% 0; } 50% { background-position: -20% 0; } }
  .cta .k { display: block; color: var(--gold-hi); font-weight: 800; font-size: 20px; letter-spacing: .02em; padding-right: 36px; }
  .cta .s { display: block; color: var(--text-dim); font-size: 14px; margin-top: 5px; padding-right: 36px; }
  .cta .go {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    color: var(--gold); font-size: 22px;
  }

  .section-label {
    margin: 34px 2px 14px;
    color: var(--text-dim); font-size: 12px; font-weight: 700;
    letter-spacing: .3em; text-transform: uppercase;
  }

  /* Module grid — six doors into the gym. Large targets, zero clutter. */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile {
    min-height: 128px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--ink-3), var(--ink-2));
    padding: 18px 16px 16px;
    text-align: left;
    display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    transition: transform .12s ease, border-color .2s ease;
  }
  .tile:active { transform: scale(.97); border-color: rgba(201,162,74,.5); }
  .tile .ico { font-size: 27px; line-height: 1; }
  .tile .t  { display: block; font-weight: 800; font-size: 16px; }
  .tile .d  { display: block; color: var(--text-dim); font-size: 12.5px; margin-top: 4px; line-height: 1.35; }
  .tile.adv .badge {
    align-self: flex-start;
    font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold); border: 1px solid rgba(201,162,74,.45);
    padding: 3px 8px; border-radius: 999px;
  }

  /* Quick start — always one tap away at the gym */
  .quickbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(7,7,10,.92) 34%);
    display: flex; justify-content: center;
  }
  .quickbar button {
    width: 100%; max-width: 520px;
    min-height: var(--tap-min);
    border-radius: 999px;
    background: var(--red);
    color: #fff; font-weight: 900; font-size: 17px;
    letter-spacing: .24em; text-indent: .24em; text-transform: uppercase;
    box-shadow: 0 8px 30px rgba(215,38,61,.35);
    transition: transform .12s ease;
  }
  .quickbar button:active { transform: scale(.97); }

  /* Toast for not-yet-built modules */
  #toast {
    position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--ink-3); border: 1px solid var(--line);
    color: var(--text); font-size: 14px;
    padding: 14px 22px; border-radius: 12px;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    max-width: 88vw; text-align: center;
    z-index: 60;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Respect fighters who turn motion off — no cinema, straight to work */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- ================= LAUNCH SEQUENCE ================= -->
<div id="splash" role="dialog" aria-label="DP Combat opening">
  <div class="spotlight"></div>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="flash" aria-hidden="true"></div>
  <div class="shockwave" aria-hidden="true"></div>

  <div class="stage">
    <div class="mark">
      <div class="dp metal condensed">DP</div>
      <div class="combat metal condensed">Combat</div>
      <div class="rule" aria-hidden="true"></div>
      <div class="tagline condensed">Train smarter · Fight better</div>
    </div>
    <div class="enter">
      <button id="enterBtn">Enter the gym</button>
    </div>
  </div>

  <button class="skip condensed" id="skipBtn">Skip</button>
</div>

<!-- ================= HOME ================= -->
<main id="home" hidden>
  <div class="shell">
    <header class="top">
      <div class="brandmark">
        <span class="dp metal condensed">DP</span>
        <span class="combat condensed">Combat</span>
      </div>
      <button id="soundToggle" aria-label="Toggle sound" aria-pressed="true">🔔</button>
    </header>

    <section class="hero">
      <div class="greet condensed" id="greet">Welcome to camp</div>
      <h1 id="heroTitle">Step into the ring.</h1>
      <p class="motto"><b>Train smarter. Fight better.</b> Every round counts.</p>
      <button class="cta" id="primaryCta">
        <span class="k" id="ctaTitle">Start your first round</span>
        <span class="s" id="ctaSub">A guided 3-minute opener. Gloves on.</span>
        <span class="go" aria-hidden="true">→</span>
      </button>
    </section>

    <div class="section-label">Your gym</div>
    <nav class="grid" aria-label="Training modules">
      <button class="tile" data-module="Start Training">
        <span class="ico" aria-hidden="true">🥊</span>
        <span><span class="t">Start Training</span>
        <span class="d">Rounds, combos, pad work</span></span>
      </button>
      <button class="tile adv" data-module="Fight Simulation">
        <span class="ico" aria-hidden="true">⚔️</span>
        <span><span class="t">Fight Simulation</span>
        <span class="d">Scenario rounds vs. styles</span>
        <span class="badge" hidden>Pro</span></span>
      </button>
      <button class="tile" data-module="Conditioning">
        <span class="ico" aria-hidden="true">🔥</span>
        <span><span class="t">Conditioning</span>
        <span class="d">Engine, strength, recovery</span></span>
      </button>
      <button class="tile adv" data-module="Fight IQ">
        <span class="ico" aria-hidden="true">🧠</span>
        <span><span class="t">Fight IQ</span>
        <span class="d">Strategy, film, ring craft</span>
        <span class="badge" hidden>Pro</span></span>
      </button>
      <button class="tile" data-module="Progress">
        <span class="ico" aria-hidden="true">📈</span>
        <span><span class="t">Progress</span>
        <span class="d">Rounds logged, streaks, gains</span></span>
      </button>
      <button class="tile" data-module="Fighter Profile">
        <span class="ico" aria-hidden="true">👤</span>
        <span><span class="t">Fighter Profile</span>
        <span class="d">Your record, stance, goals</span></span>
      </button>
    </nav>
  </div>

  <div class="quickbar">
    <button id="quickStart">Quick start</button>
  </div>
</main>

<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  /* ---------- fighter memory: the app grows with the user ---------- */
  var store = {
    get: function (k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var sessions = parseInt(store.get("dp_sessions", "0"), 10) || 0;
  store.set("dp_sessions", String(sessions + 1));
  var experienced = sessions >= 3;

  /* ---------- sound design: real bell physics, synthesized ---------- */
  var soundOn = store.get("dp_sound", "on") === "on";
  var actx = null;
  function audio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  // Ring-side bell: inharmonic metal partials with a hard strike and long decay
  function bell(when) {
    var ctx = audio(); if (!ctx || !soundOn) return;
    var t = ctx.currentTime + (when || 0);
    var partials = [
      [523, 1.0], [1240, 0.55], [1660, 0.35], [2130, 0.22], [2890, 0.12]
    ];
    var out = ctx.createGain();
    out.gain.value = 0.5;
    out.connect(ctx.destination);
    partials.forEach(function (p) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = p[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p[1] * 0.4, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 2.4);
    });
  }
  // Deep impact: the punch landing — low thump plus a snap of noise
  function impact() {
    var ctx = audio(); if (!ctx || !soundOn) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.28);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.4);

    var len = Math.floor(ctx.sampleRate * 0.09);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    var src = ctx.createBufferSource(); src.buffer = buf;
    var ng = ctx.createGain(); ng.gain.value = 0.35;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800;
    src.connect(lp); lp.connect(ng); ng.connect(ctx.destination);
    src.start(t);
  }

  /* ---------- dust drifting through the spotlight ---------- */
  var dustCanvas = document.getElementById("dust");
  var dustRAF = 0;
  function startDust() {
    var ctx2d = dustCanvas.getContext("2d");
    if (!ctx2d) return;
    var W, H, motes = [];
    function size() {
      W = dustCanvas.width = dustCanvas.offsetWidth * devicePixelRatio;
      H = dustCanvas.height = dustCanvas.offsetHeight * devicePixelRatio;
    }
    size();
    addEventListener("resize", size);
    for (var i = 0; i < 46; i++) {
      motes.push({
        x: Math.random(), y: Math.random(),
        r: (Math.random() * 1.4 + 0.4) * devicePixelRatio,
        vx: (Math.random() - 0.5) * 0.00022,
        vy: -(Math.random() * 0.00028 + 0.00006),
        a: Math.random() * 0.5 + 0.1,
        ph: Math.random() * Math.PI * 2
      });
    }
    function frame(ts) {
      ctx2d.clearRect(0, 0, W, H);
      for (var i = 0; i < motes.length; i++) {
        var m = motes[i];
        m.x += m.vx; m.y += m.vy;
        if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
        if (m.x < -0.02) m.x = 1.02; if (m.x > 1.02) m.x = -0.02;
        // motes only catch the light inside the beam
        var dx = m.x - 0.5, dy = m.y - 0.44;
        var beam = Math.max(0, 1 - (dx * dx / 0.055 + dy * dy / 0.035));
        var tw = 0.6 + 0.4 * Math.sin(ts / 900 + m.ph);
        ctx2d.globalAlpha = m.a * beam * tw;
        ctx2d.fillStyle = "#f7e7ae";
        ctx2d.beginPath();
        ctx2d.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2);
        ctx2d.fill();
      }
      dustRAF = requestAnimationFrame(frame);
    }
    dustRAF = requestAnimationFrame(frame);
  }
  function stopDust() { cancelAnimationFrame(dustRAF); }

  /* ---------- the opening: dark → light → impact → metal ---------- */
  var splash = document.getElementById("splash");
  var home = document.getElementById("home");
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function runOpening() {
    startDust();
    at(600,  function () { splash.classList.add("lit"); });      // spotlight finds the dark
    at(2400, function () {                                       // the punch lands
      splash.classList.add("hit", "shake", "reveal");
      impact();
    });
    at(2900, function () { splash.classList.add("sweep"); });    // light travels the metal
    at(5200, function () { splash.classList.add("ready"); });    // invitation
  }

  function enterGym(withBell) {
    timers.forEach(clearTimeout);
    splash.classList.add("done", "reveal", "sweep");
    stopDust();
    home.hidden = false;
    requestAnimationFrame(function () { home.classList.add("in"); });
    if (withBell) bell(0.05);
    setTimeout(function () { splash.remove(); }, 1000);
  }

  document.getElementById("enterBtn").addEventListener("click", function () { enterGym(true); });
  document.getElementById("skipBtn").addEventListener("click", function () { enterGym(false); });

  if (reduced) {
    // No cinema for reduced-motion fighters — straight into the gym.
    enterGym(false);
  } else {
    runOpening();
  }

  /* ---------- progressive depth: beginner vs. experienced ---------- */
  var greet = document.getElementById("greet");
  var heroTitle = document.getElementById("heroTitle");
  var ctaTitle = document.getElementById("ctaTitle");
  var ctaSub = document.getElementById("ctaSub");
  if (experienced) {
    greet.textContent = "Back in camp";
    heroTitle.textContent = "Pick up where you left off.";
    ctaTitle.textContent = "Create custom fight simulation";
    ctaSub.textContent = "Build rounds, opponents and pace your way.";
    document.querySelectorAll(".tile.adv .badge").forEach(function (b) { b.hidden = false; });
  }

  /* ---------- home interactions ---------- */
  var toast = document.getElementById("toast");
  var toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2400);
  }

  document.querySelectorAll(".tile").forEach(function (tile) {
    tile.addEventListener("click", function () {
      impact();
      showToast(tile.dataset.module + " — this module opens in the next build.");
    });
  });
  document.getElementById("primaryCta").addEventListener("click", function () {
    bell();
    showToast(experienced
      ? "Custom simulation builder opens in the next build."
      : "Round 1 guided session opens in the next build.");
  });
  document.getElementById("quickStart").addEventListener("click", function () {
    bell();
    showToast("Quick start: 3-minute round, 1-minute rest. Coming in the next build.");
  });

  var soundToggle = document.getElementById("soundToggle");
  function paintSound() {
    soundToggle.textContent = soundOn ? "🔔" : "🔕";
    soundToggle.setAttribute("aria-pressed", String(soundOn));
    soundToggle.setAttribute("aria-label", soundOn ? "Sound on. Tap to mute." : "Sound off. Tap to unmute.");
  }
  soundToggle.addEventListener("click", function () {
    soundOn = !soundOn;
    store.set("dp_sound", soundOn ? "on" : "off");
    paintSound();
    if (soundOn) bell();
  });
  paintSound();
})();
</script>
</body>
</html>
